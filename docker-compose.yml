# Deployment for a droplet shared with other production services.
#
# Nothing is published to the host. The tunnel reaches the app over the compose
# network, so no inbound port is opened and the droplet's address stays out of
# DNS. Memory limits are the point of this file: an unbounded headless browser
# on a 2 GB box would put the neighbouring services at risk.

services:
  app:
    build: .
    image: webmcp-forge:local
    restart: unless-stopped
    # Chrome leaves child processes behind when it exits, and `npm start` as
    # PID 1 never reaps them. They cost no memory but do hold PID table
    # entries, so they accumulate across scans. This puts a real init process
    # at PID 1 to collect them, and it forwards signals so `docker stop` shuts
    # the server down cleanly instead of killing it.
    init: true
    env_file: .env
    volumes:
      # Job JSON lives here. Bind mount rather than a named volume so a backup
      # is a plain directory copy.
      - ./data:/data
    # Peak is roughly 250 MB for the server plus 400-600 MB for a browser
    # scanning up to eight pages. The cap means an overrun kills this container
    # and nothing else on the box.
    mem_limit: 900m
    memswap_limit: 1500m
    cpus: 1.0
    # Chrome writes to /dev/shm and the default 64 MB is too small for it.
    shm_size: 256m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:43127/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3

  # Off unless asked for: `docker compose --profile lightpanda up -d`.
  # A plain `up` leaves it alone, so the default deployment is unchanged.
  #
  # To use it, set SCANNER_ENGINE=lightpanda and
  # SCANNER_CDP_URL=http://lightpanda:9222 in .env, then recreate the app.
  lightpanda:
    # A moving tag. Behaviour was verified against
    # sha256:3af0bcaed8ce2bd5d5919cf28008c0b5fb5074abead8bce9568d04b02628fd14
    # on 2026-09-10; compare against that when the image changes.
    image: lightpanda/browser:nightly
    profiles: ["lightpanda"]
    restart: unless-stopped
    # Playwright asks /json/version where to open its WebSocket and then
    # believes the answer. Bound to a wildcard, Lightpanda answers
    # ws://127.0.0.1:9222, which sends the app to its own loopback where
    # nothing listens. Advertising the service name gives the app an address
    # that means something on the compose network.
    command:
      - /bin/lightpanda
      - serve
      - --host
      - 0.0.0.0
      - --port
      - "9222"
      - --advertise-host
      - lightpanda
    environment:
      # Telemetry is on by default and reports to telemetry.lightpanda.io.
      # This browser opens other people's sites on their behalf, so it does not
      # get to phone home about that. Verified against the nightly image: the
      # startup line changes from disabled=false to disabled=true.
      #
      # The check is for the variable's presence, not its value: "false" and
      # "" switch telemetry off just as surely as "true" does. Only removing
      # the line turns it back on. "true" is used anyway, so the meaning still
      # holds if a later version starts reading the value.
      LIGHTPANDA_DISABLE_TELEMETRY: "true"
      # Local core dumps only. The upstream privacy policy says the variable
      # above already covers crash reports sent to crash.lightpanda.io.
      LIGHTPANDA_DISABLE_CORE_DUMP: "true"
    # Measured at 18 MB after four pages and 44 MB after three real sites, so
    # this cap is generous. Chrome needs roughly twenty times as much.
    mem_limit: 256m

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    # Ingress rules live in Cloudflare, not here, so the token is all it needs.
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    depends_on:
      - app
    mem_limit: 128m
